[project]
name = "weather-streaming-pipeline"
version = "0.1.0"
description = "Real-time weather data pipeline using Kafka and PySpark"
readme = "README.md"
# Spark 3.5.0 works most stably on Python 3.11
requires-python = ">=3.10,<3.12"
dependencies = [
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
# Group for Consumer (Spark)
consumer = [
    "pyspark==3.5.0",
]
# Group for Producer (Kafka + API)
producer = [
    "kafka-python-ng>=2.2.3",
    "requests>=2.31.0",
]

[tool.uv]
# Force uv to use Python 3.11 when syncing in Docker
python-preference = "only-managed"